<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注水泥参数优化</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>注水泥参数优化</h1><p class="lead">注水泥设计需兼顾顶替效果与压力窗口。循环流动的环空摩阻会增加等效循环密度 ECD，静态浆体密度并不能完整代表施工时的压力作用。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>压力窗口上限 ×100 <output id="pv"></output></label><input id="param" aria-label="压力窗口上限 ×100" type="range" min="160" max="205" value="185" step="1"></div><div class="ctl"><label>观测噪声 / 不利裕度 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：阈值/真值；绿：学习/优化；蓝：基线。各图按标注单位读取。</div><figure><figcaption>候选排量与代理顶替效率</figcaption><canvas id="a" width="640" height="340" aria-label="候选排量与代理顶替效率"></canvas></figure><figure><figcaption>ECD与压力窗口上下限</figcaption><canvas id="b" width="640" height="340" aria-label="ECD与压力窗口上下限"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 inherit"></pre><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><p>岭回归代理 + 约束网格搜索；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">只搜索排量；密度与水力关系均为教学假设，不设计实际浆柱结构、流变性或替浆工艺。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
