<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>射孔参数智能设计</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>射孔参数智能设计</h1><p class="lead">射孔孔道穿过套管与水泥环连通储层。孔密、穿深和相位影响流入通道，设计需平衡产能、出砂和作业条件，不能简单追求更多孔或更深穿透。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>允许出砂代价上限 <output id="pv"></output></label><input id="param" aria-label="允许出砂代价上限" type="range" min="5" max="60" value="30" step="1"></div><div class="ctl"><label>额外代价裕度 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：阈值/真值/推荐；绿：学习/策略；蓝：基线。各图按标注单位读取。</div><figure><figcaption>48组候选射孔组合的产能指数</figcaption><canvas id="a" width="640" height="340" aria-label="48组候选射孔组合的产能指数"></canvas></figure><figure><figcaption>产能—代价帕累托散点：绿前沿、灰被支配、橙推荐</figcaption><canvas id="b" width="640" height="340" aria-label="产能—代价帕累托散点：绿前沿、灰被支配、橙推荐"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 sans-serif;max-height:280px;overflow:auto;background:#f8f6ef;padding:10px"></pre><p>双代理岭回归 + 帕累托筛选；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">产能与出砂代价均为合成无量纲指数，未作弹型、应力与真实产能计算。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
