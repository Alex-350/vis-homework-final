<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能完井滑套控制策略</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>智能完井滑套控制策略</h1><p class="lead">智能完井可调整分段流入通道开度，在有效产液与出水之间进行权衡。控制影响未来状态，因此当前全开不一定获得最佳累计收益。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>测试水处理代价 ×100 <output id="pv"></output></label><input id="param" aria-label="测试水处理代价 ×100" type="range" min="10" max="100" value="70" step="1"></div><div class="ctl"><label>状态观测误差 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：阈值/真值/推荐；绿：学习/策略；蓝：基线。各图按标注单位读取。</div><figure><figcaption>Q策略和全开基线的累计奖励</figcaption><canvas id="a" width="640" height="340" aria-label="Q策略和全开基线的累计奖励"></canvas></figure><figure><figcaption>策略开度与含水状态的动态轨迹</figcaption><canvas id="b" width="640" height="340" aria-label="策略开度与含水状态的动态轨迹"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 sans-serif;max-height:280px;overflow:auto;background:#f8f6ef;padding:10px"></pre><p>表格 Q-learning 控制；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">只控制单个等效区段，不模拟多段耦合或真实储层；累计收益不是累计产油量。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
