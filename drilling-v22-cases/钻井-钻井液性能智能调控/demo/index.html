<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钻井液性能智能调控</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>钻井液性能智能调控</h1><p class="lead">钻井液承担携岩、冷却润滑与压力控制等任务。塑性黏度是流变参数之一，与固相、流体基液和温度等因素有关；不能把塑性黏度直接等同于携岩能力。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>归一化含砂特征 ×100 <output id="pv"></output></label><input id="param" aria-label="归一化含砂特征 ×100" type="range" min="0" max="100" value="40"></div><div class="ctl"><label>观测噪声 / 扰动 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：设计/真值；绿：学习/受控；灰：传统基线；各图按标注单位读取。</div><figure><figcaption>PV真值、估计、固定基线与目标</figcaption><canvas id="a" width="640" height="340" aria-label="PV真值、估计、固定基线与目标"></canvas></figure><figure><figcaption>归一化处理方向，不是药剂剂量</figcaption><canvas id="b" width="640" height="340" aria-label="归一化处理方向，不是药剂剂量"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><p>岭回归软测量 + 处理方向搜索；400条独立训练样本，换井不改变训练参数。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">仅估算塑性黏度，不同时优化密度、动切力或滤失；建议不对应实际药剂种类和加量。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
