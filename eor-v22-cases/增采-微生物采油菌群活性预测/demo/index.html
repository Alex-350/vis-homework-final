<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微生物采油菌群活性预测</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>微生物采油菌群活性预测</h1><p class="lead">微生物代谢可能改变油藏中的流动条件，但活性与环境、营养及群落演替有关。短期活性响应并不直接证明长期增油效果。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>归一化温度代理 ×100 <output id="pv"></output></label><input id="param" aria-label="归一化温度代理 ×100" type="range" min="0" max="100" value="50" step="1"></div><div class="ctl"><label>盐度代理 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：真值/阈值；绿：学习/优化；蓝：基线。各图按标注单位读取。</div><figure><figcaption>代谢活性代理：真值、回归与固定基线</figcaption><canvas id="a" width="640" height="340" aria-label="代谢活性代理：真值、回归与固定基线"></canvas></figure><figure><figcaption>独立测试的活性预测误差</figcaption><canvas id="b" width="640" height="340" aria-label="独立测试的活性预测误差"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 inherit"></pre><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><p>环境交互回归软测量；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">活性指数非菌浓或存活率，不模拟演替，也不提供菌种、培养或营养液操作方案。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
