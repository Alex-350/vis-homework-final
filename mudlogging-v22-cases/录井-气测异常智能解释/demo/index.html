<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>气测异常智能解释</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>气测异常智能解释</h1><p class="lead">气测监测返出气体中的全烃及组分。峰值可能与油气显示有关，也受脱气效率、停泵和钻井液条件影响，不能仅凭气峰判定产能。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>异常阈值 ×10 <output id="pv"></output></label><input id="param" aria-label="异常阈值 ×10" type="range" min="5" max="40" value="20" step="1"></div><div class="ctl"><label>观测噪声 / 词语缺失 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">类别编码：0=背景；1=异常。图中单位及曲线含义见右侧说明。</div><figure><figcaption>全烃观测序列（含合成工况漂移）</figcaption><canvas id="a" width="640" height="340" aria-label="全烃观测序列（含合成工况漂移）"></canvas></figure><figure><figcaption>校正后分数、阈值与真值区间</figcaption><canvas id="b" width="640" height="340" aria-label="校正后分数、阈值与真值区间"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 inherit"></pre><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><p>学习正常基线 + 校正后 z 分数；400条独立训练样本，换井不改变训练参数。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">演示漂移量已知；现场必须估计并验证工况校正，不能把峰值直接解释为油气层。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
