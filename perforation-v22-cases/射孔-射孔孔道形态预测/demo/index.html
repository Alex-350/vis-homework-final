<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>射孔孔道形态预测</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>射孔孔道形态预测</h1><p class="lead">穿深表示孔道延伸入地层的有效长度，孔径与孔道周围受损带也影响流动。靶试、应力条件与地层差异使实验关系难以直接外推。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>归一化岩石强度 ×100 <output id="pv"></output></label><input id="param" aria-label="归一化岩石强度 ×100" type="range" min="0" max="100" value="50" step="1"></div><div class="ctl"><label>强度观测噪声 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：阈值/观测；绿：模型/拟合；蓝：参考基线。各图按标注单位读取。</div><figure><figcaption>穿深真值、双代理预测与固定基线</figcaption><canvas id="a" width="640" height="340" aria-label="穿深真值、双代理预测与固定基线"></canvas></figure><figure><figcaption>应力变化下的孔径代理预测</figcaption><canvas id="b" width="640" height="340" aria-label="应力变化下的孔径代理预测"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 sans-serif;max-height:260px;overflow:auto;background:#f8f6ef;padding:10px"></pre><p>双输出回归代理；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">合成回归不是数值爆轰或真实靶试模型，不包含实际射孔弹制造或装药参数。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
