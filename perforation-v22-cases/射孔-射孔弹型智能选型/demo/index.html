<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>射孔弹型智能选型</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>射孔弹型智能选型</h1><p class="lead">不同型号在穿深、孔径与井况兼容性上有取舍。选型应先检查适用条件，再比较目标匹配程度，保留被排除方案的理由。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>目标穿深特征 ×100 <output id="pv"></output></label><input id="param" aria-label="目标穿深特征 ×100" type="range" min="0" max="100" value="70" step="1"></div><div class="ctl"><label>套管条件基础代理 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：阈值/观测；绿：模型/拟合；蓝：参考基线。各图按标注单位读取。</div><figure><figcaption>虚拟型号的穿深与孔径特征</figcaption><canvas id="a" width="640" height="340" aria-label="虚拟型号的穿深与孔径特征"></canvas></figure><figure><figcaption>兼容筛选后的匹配分数</figcaption><canvas id="b" width="640" height="340" aria-label="兼容筛选后的匹配分数"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 sans-serif;max-height:260px;overflow:auto;background:#f8f6ef;padding:10px"></pre><p>虚拟参数库 + 规则匹配检索；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">仅用四个虚拟型号，无真实产品或弹药规格，不训练机器学习模型，不宣称完整知识图谱。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
