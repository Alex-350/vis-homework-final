<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>射孔效果智能评估</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>射孔效果智能评估</h1><p class="lead">压力与产量的关系可反映井的综合流入能力。射孔损伤是影响因素之一，渗透率、流体、厚度和其他近井效应同样重要，因此反演有解释多解性。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>真值相对参考水平（%） <output id="pv"></output></label><input id="param" aria-label="真值相对参考水平（%）" type="range" min="10" max="100" value="60" step="1"></div><div class="ctl"><label>液量观测噪声 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：阈值/观测；绿：模型/拟合；蓝：参考基线。各图按标注单位读取。</div><figure><figcaption>压差试验观测、最小二乘拟合与参考线</figcaption><canvas id="a" width="640" height="340" aria-label="压差试验观测、最小二乘拟合与参考线"></canvas></figure><figure><figcaption>候选产能系数的平方误差目标</figcaption><canvas id="b" width="640" height="340" aria-label="候选产能系数的平方误差目标"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 sans-serif;max-height:260px;overflow:auto;background:#f8f6ef;padding:10px"></pre><p>最小二乘产能系数反演；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">只拟合简化单相线性关系，不反演表皮系数，不把产能比直接叫作射孔独有效率。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
