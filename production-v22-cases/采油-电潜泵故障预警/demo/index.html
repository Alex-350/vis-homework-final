<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电潜泵故障预警</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>电潜泵故障预警</h1><p class="lead">电潜泵依靠井下电机驱动，电流、温度和压力等观测可反映运行状态。异常既可能来自设备退化，也可能来自井况或传感器变化。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>综合异常阈值 ×10 <output id="pv"></output></label><input id="param" aria-label="综合异常阈值 ×10" type="range" min="5" max="60" value="20" step="1"></div><div class="ctl"><label>观测噪声 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：真值/阈值；绿：模型/优化；蓝：基线。各图按标注单位读取。</div><figure><figcaption>多通道异常分数与报警阈值</figcaption><canvas id="a" width="640" height="340" aria-label="多通道异常分数与报警阈值"></canvas></figure><figure><figcaption>合成退化区间与两种报警分层对照</figcaption><canvas id="b" width="640" height="340" aria-label="合成退化区间与两种报警分层对照"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 inherit"></pre><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><p>正常工况统计学习；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">不识别具体故障类型，不报告现场故障概率或承诺预警提前时间。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
