<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>结蜡结垢预测</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试井 · 种子 <span id="seed"></span></span><h1>结蜡结垢预测</h1><p class="lead">结蜡涉及原油蜡组分析出与沉积；结垢涉及水中无机物沉淀。二者都可能降低通流能力，但机制和需要的数据不同，不能混为同一种风险。</p></div><button id="new" class="btn primary">换一口井 ↻</button></header><div class="demo-controls"><div class="ctl"><label>冷却代理水平 ×100 <output id="pv"></output></label><input id="param" aria-label="冷却代理水平 ×100" type="range" min="0" max="100" value="50" step="1"></div><div class="ctl"><label>观测噪声 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：真值/阈值；绿：模型/优化；蓝：基线。各图按标注单位读取。</div><figure><figcaption>结蜡与结垢分别计算的模型分数</figcaption><canvas id="a" width="640" height="340" aria-label="结蜡与结垢分别计算的模型分数"></canvas></figure><figure><figcaption>结蜡真值与报警（结垢逐点结果见右侧）</figcaption><canvas id="b" width="640" height="340" aria-label="结蜡真值与报警（结垢逐点结果见右侧）"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 inherit"></pre><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><p>双任务逻辑回归；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">二维合成模型不替代析蜡温度或离子平衡计算，不直接生成清防作业周期。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
