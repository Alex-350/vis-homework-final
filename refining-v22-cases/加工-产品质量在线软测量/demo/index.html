<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品质量在线软测量</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试工况 · 种子 <span id="seed"></span></span><h1>产品质量在线软测量</h1><p class="lead">部分产品质量依赖滞后的实验室化验。软测量用较易取得的过程变量估计质量，但必须对齐取样时间，并监测原料和传感器变化。</p></div><button id="new" class="btn primary">换一组样例 ↻</button></header><div class="demo-controls"><div class="ctl"><label>目标区间覆盖率（%） <output id="pv"></output></label><input id="param" aria-label="目标区间覆盖率（%）" type="range" min="80" max="95" value="90" step="1"></div><div class="ctl"><label>过程输入误差 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：真值/阈值；绿：模型/校正；蓝：基线或区间界限。各图按标注单位读取。</div><figure><figcaption>闪点代理真值、点预测与校准区间带</figcaption><canvas id="a" width="640" height="340" aria-label="闪点代理真值、点预测与校准区间带"></canvas></figure><figure><figcaption>独立测试的软测量误差</figcaption><canvas id="b" width="640" height="340" aria-label="独立测试的软测量误差"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 sans-serif;max-height:260px;overflow:auto;background:#f8f6ef;padding:10px"></pre><p>过程回归 + 独立残差区间校准；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">不做真实化验滞后对齐或合格判定，输入偏移可能破坏区间覆盖前提。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
