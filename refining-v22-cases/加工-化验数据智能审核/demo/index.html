<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>化验数据智能审核</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试工况 · 种子 <span id="seed"></span></span><h1>化验数据智能审核</h1><p class="lead">化验报告影响过程判断与产品放行。缺失、单位和录入错误可能违背范围规则，单项合理的数值也可能与同批次数据关系不一致。</p></div><button id="new" class="btn primary">换一组样例 ↻</button></header><div class="demo-controls"><div class="ctl"><label>关系残差阈值 ×10 <output id="pv"></output></label><input id="param" aria-label="关系残差阈值 ×10" type="range" min="5" max="50" value="25" step="1"></div><div class="ctl"><label>合成录入错误比例 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：真值/阈值；绿：模型/校正；蓝：基线或区间界限。各图按标注单位读取。</div><figure><figcaption>关系残差及人工复核阈值</figcaption><canvas id="a" width="640" height="340" aria-label="关系残差及人工复核阈值"></canvas></figure><figure><figcaption>注入错误、混合审核与单范围规则对照</figcaption><canvas id="b" width="640" height="340" aria-label="注入错误、混合审核与单范围规则对照"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 sans-serif;max-height:260px;overflow:auto;background:#f8f6ef;padding:10px"></pre><p>固定文本抽取 + 范围规则 + 正常关系回归；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">固定格式正则不是通用语言理解，合成指标关系不是实际通用规律，不改写原值或判定产品合格。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
