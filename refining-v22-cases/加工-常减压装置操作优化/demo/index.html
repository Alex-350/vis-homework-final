<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>常减压装置操作优化</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试工况 · 种子 <span id="seed"></span></span><h1>常减压装置操作优化</h1><p class="lead">常减压蒸馏利用馏分挥发性差异进行分离。回流和供热等操作会同时影响分离效果、收率与能耗，需要在原料条件和质量限制下比较。</p></div><button id="new" class="btn primary">换一组样例 ↻</button></header><div class="demo-controls"><div class="ctl"><label>能耗代理预算 <output id="pv"></output></label><input id="param" aria-label="能耗代理预算" type="range" min="20" max="90" value="65" step="1"></div><div class="ctl"><label>原料变重基础代理 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：真值/阈值；绿：模型/校正；蓝：基线或区间界限。各图按标注单位读取。</div><figure><figcaption>温度—回流可行域热图（橙框最优，蓝框核对）</figcaption><canvas id="a" width="640" height="340" aria-label="温度—回流可行域热图（橙框最优，蓝框核对）"></canvas></figure><figure><figcaption>能耗—质量约束散点图（两条约束同时核对）</figcaption><canvas id="b" width="640" height="340" aria-label="能耗—质量约束散点图（两条约束同时核对）"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 sans-serif;max-height:260px;overflow:auto;background:#f8f6ef;padding:10px"></pre><p>收率回归代理 + 约束搜索；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">不计算实际切割点或温压设定，不连接 DCS/APC，不能用于装置操作。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
