<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>炼化设备预测性维护</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试工况 · 种子 <span id="seed"></span></span><h1>炼化设备预测性维护</h1><p class="lead">机泵等设备的振动趋势可提供退化线索，但工况切换、故障模式和测量位置也会影响振动。到阈值时间仅在趋势假设下有意义。</p></div><button id="new" class="btn primary">换一组样例 ↻</button></header><div class="demo-controls"><div class="ctl"><label>振动教学阈值 ×10 <output id="pv"></output></label><input id="param" aria-label="振动教学阈值 ×10" type="range" min="40" max="100" value="70" step="1"></div><div class="ctl"><label>振动观测噪声 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：真值/阈值；绿：模型/校正；蓝：基线或区间界限。各图按标注单位读取。</div><figure><figcaption>历史70天拟合与未来30天留出验证</figcaption><canvas id="a" width="640" height="340" aria-label="历史70天拟合与未来30天留出验证"></canvas></figure><figure><figcaption>留出段趋势误差（历史段置零不验收）</figcaption><canvas id="b" width="640" height="340" aria-label="留出段趋势误差（历史段置零不验收）"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 sans-serif;max-height:260px;overflow:auto;background:#f8f6ef;padding:10px"></pre><p>时间回归趋势 + 到阈值外推；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">不诊断故障类型，不作真实 RUL 或检修承诺，教学阈值不对应设备规范。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
