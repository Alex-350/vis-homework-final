<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地震资料噪声压制</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试资料 · 种子 <span id="seed"></span></span><h1>地震资料噪声压制：从波形证据到可复核结果</h1><p class="lead">有效反射在邻道上具有一定连续性，随机噪声常缺乏这种连续性。去噪要兼顾信噪比与振幅保真，否则可能抹去薄层和微小断层。</p></div><button class="btn primary" id="new">换一幅剖面 ↻</button></header><div class="demo-controls"><div class="ctl"><label>观测噪声 <output id="nv"></output></label><input id="noise" aria-label="观测噪声" type="range" min="0" max="100" value="30"></div><div class="ctl"><label>邻居数量 k <output id="kv"></output></label><input id="k" aria-label="邻居数量" type="range" min="1" max="15" step="2" value="5"></div></div><div class="demo-body"><section class="demo-charts"><div class="map-tools"><label for="view">右图显示</label><select id="view"><option value="pred">学习结果</option><option value="truth">合成真值</option><option value="error">误差 / 错误位置</option></select><span>点击图表联动逐点核对</span></div><div class="legend">振幅热图蓝/红：负/正；分类绿/橙/蓝：平行/倾斜/杂乱；曲线绿：学习，橙：真值，灰：基线。</div><div class="image-pair"><figure><figcaption id="leftTitle">含噪输入：横轴道号，纵轴时间 0–178 ms</figcaption><canvas id="a" width="500" height="300"></canvas></figure><figure><figcaption id="rightTitle">学习输出：与输入网格一致</figcaption><canvas id="b" width="500" height="300"></canvas></figure></div><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="分组误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><section class="inspect"><div class="section-head"><h2>逐点核对：输入、预测与基线</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" type="range" min="0" max="99" value="30"></label><div class="point-values" id="point-values"></div><p id="point-explain"></p></section><details><summary>展开训练与结果明细</summary><p>训练种子 17，测试种子可更换。分类/波形回归使用 800 个独立训练场景窗口；储层回归使用 350 个属性样本。未采用深度网络，合成指标不代表现场精度。</p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">纯前端教学；模型可能不如基线，需结合井震标定、地质约束和独立工区验证。</p></aside></div></div><script src="demo.js"></script></body></html>
