<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>储罐液位与泄漏智能监控</title><link rel="stylesheet" href="demo.css"></head><body><div class="panel"><header class="demo-head"><div><span class="kicker">独立合成测试工况 · 种子 <span id="seed"></span></span><h1>储罐液位与泄漏智能监控</h1><p class="lead">储罐液位变化应与净入流和罐体几何相符。多传感器可以帮助核对读数，但液位异常也可能由计量和传感故障引起。</p></div><button id="new" class="btn primary">换一组样例 ↻</button></header><div class="demo-controls"><div class="ctl"><label>合成未解释流失（m³/h） <output id="pv"></output></label><input id="param" aria-label="合成未解释流失（m³/h）" type="range" min="0" max="10" value="6" step="1"></div><div class="ctl"><label>观测噪声 <output id="nv"></output></label><input id="noise" aria-label="噪声" type="range" min="0" max="100" value="20"></div></div><div class="demo-body"><section class="demo-charts charts"><div class="legend">橙：真值/阈值；绿：模型/校正；蓝：基线或另一传感代理。各图按标注单位读取。</div><figure><figcaption>真实液位、雷达和视觉数值代理</figcaption><canvas id="a" width="640" height="340" aria-label="真实液位、雷达和视觉数值代理"></canvas></figure><figure><figcaption>五分钟物料平衡残差与报警阈值</figcaption><canvas id="b" width="640" height="340" aria-label="五分钟物料平衡残差与报警阈值"></canvas></figure><svg id="diagnostic" viewBox="0 0 720 170" role="img" aria-label="逐点误差分析"></svg></section><aside class="demo-results"><div id="metrics" aria-live="polite"></div><p class="note" id="explain"></p><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 inherit"></pre><section class="inspect"><div class="section-head"><h2>逐点核对：计算结果与依据</h2><span id="position"></span></div><label class="point-control">选择位置<input id="point" aria-label="核对位置" type="range" min="0" max="89" value="25"></label><div id="point-values" class="point-values"></div><p id="point-explain"></p></section><details><summary>展开模型系数与结果明细</summary><p>物料平衡 + 学习正常残差；训练/优化依据见实际模型明细，换井不重新训练。</p><p id="coeff" class="coeff"></p><div id="details"></div></details><div class="actions"><button id="run">重新计算</button><button id="reset">恢复默认</button><button id="csv">导出本次 CSV</button></div><p class="note">视觉仅为数值代理，不实现视频识别；异常残差不等于已确认泄漏。 全部数据为合成教学资料，结果需要独立井验证和人工复核。</p></aside></div></div><script src="demo.js"></script></body></html>
